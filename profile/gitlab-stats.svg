<svg width="495" height="230" viewBox="0 0 495 230" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fc6d26" />
            <stop offset="100%" stop-color="#fca326" />
        </linearGradient>
    </defs>

    <style>
        .title {
            font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            fill: #ffffff;
        }

        .subtitle {
            font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            fill: #fca326;
        }

        .muted {
            font: 400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            fill: #8b949e;
        }

        .tile-label {
            font: 500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            fill: #8b949e;
        }

        .tile-value {
            font: 700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            fill: #ffffff;
        }
    </style>

    <rect x="0.5" y="0.5" width="494" height="229" rx="12" fill="#0d1117" stroke="#30363d" />
    <rect x="24" y="22" width="110" height="6" rx="3" fill="url(#accentGradient)" />

    <text x="24" y="52" class="title">🦊 GitLab Activity</text>
    <text x="24" y="72" class="subtitle">@Skopea</text>
    <text x="24" y="90" class="muted">Recent activity snapshot generated automatically</text>

    
    <rect x="24" y="110" width="141" height="48" rx="10" fill="#161b22" stroke="#30363d" />
    <rect x="24" y="110" width="4" height="48" rx="2" fill="#fca326" />
    <text x="38" y="128" class="tile-label">Projects</text>
    <text x="38" y="150" class="tile-value">0</text>
    
    
    <rect x="177" y="110" width="141" height="48" rx="10" fill="#161b22" stroke="#30363d" />
    <rect x="177" y="110" width="4" height="48" rx="2" fill="#fca326" />
    <text x="191" y="128" class="tile-label">Merge Requests</text>
    <text x="191" y="150" class="tile-value">174</text>
    
    
    <rect x="330" y="110" width="141" height="48" rx="10" fill="#161b22" stroke="#30363d" />
    <rect x="330" y="110" width="4" height="48" rx="2" fill="#fca326" />
    <text x="344" y="128" class="tile-label">Issues</text>
    <text x="344" y="150" class="tile-value">0</text>
    

    
    <rect x="24" y="170" width="141" height="48" rx="10" fill="#161b22" stroke="#30363d" />
    <rect x="24" y="170" width="4" height="48" rx="2" fill="#fca326" />
    <text x="38" y="188" class="tile-label">Recent commits</text>
    <text x="38" y="210" class="tile-value">338</text>
    
    
    <rect x="177" y="170" width="141" height="48" rx="10" fill="#161b22" stroke="#30363d" />
    <rect x="177" y="170" width="4" height="48" rx="2" fill="#fca326" />
    <text x="191" y="188" class="tile-label">Push events</text>
    <text x="191" y="210" class="tile-value">32</text>
    
    
    <rect x="330" y="170" width="141" height="48" rx="10" fill="#161b22" stroke="#30363d" />
    <rect x="330" y="170" width="4" height="48" rx="2" fill="#fca326" />
    <text x="344" y="188" class="tile-label">Active projects</text>
    <text x="344" y="210" class="tile-value">1</text>
    
